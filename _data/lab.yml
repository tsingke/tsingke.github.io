# 实验室数据（Lab 页）
# 双语：title/text 英文，title_zh/text_zh 中文（页面切中文时显示）
# name/slogan: 组名与组训
# directions: 研究方向（icon=图标名；title/title_zh；text/text_zh）
# projects: 主持项目（title/title_zh；text/text_zh；id 编号；period 时间；highlight 置顶高亮）
# patents: 专利（title/title_zh；text/text_zh）
# platform: 开源平台（name/desc/desc_zh/icon/link）

name: "CILab — Computational Intelligence Lab"
slogan: "Tailoring teaching to each student · Unifying knowledge with practice"

directions:
  - icon: "atom"
    title: "Swarm Intelligence"
    title_zh: "群体智能"
    text: "Metaheuristic algorithms inspired by collective behavior in nature."
    text_zh: "受自然界集体行为启发的元启发式算法。"

  - icon: "sparkles"
    title: "Evolutionary Computation"
    title_zh: "演化计算"
    text: "Evolution-based global optimization paradigms and new evolutionary frameworks."
    text_zh: "基于演化的全局优化范式与新演化框架。"

  - icon: "lightbulb"
    title: "Learning-assisted Optimization"
    title_zh: "学习型智能优化"
    text: "Deep and reinforcement learning embedded into metaheuristic search."
    text_zh: "将深度与强化学习嵌入元启发式搜索。"

  - icon: "network"
    title: "Large-scale Optimization"
    title_zh: "大规模优化"
    text: "Algorithms for high-dimensional, large-scale global optimization problems."
    text_zh: "面向高维、大规模全局优化问题的算法。"

  - icon: "cpu"
    title: "GPU/CUDA Parallel Computing"
    title_zh: "GPU 并行计算"
    text: "GPU-accelerated intelligent computing for efficient complex optimization."
    text_zh: "面向高效复杂优化的 GPU 加速智能计算。"

  - icon: "activity"
    title: "Bioinformatics Optimization"
    title_zh: "生物信息优化"
    text: "Biological sequence analysis and bioinformatics-driven optimization."
    text_zh: "生物序列分析与生物信息驱动的优化。"


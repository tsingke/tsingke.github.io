{% include base_path %}
<div class="card">
  {% if include.icon %}
    <div class="icon-tile"><svg class="icon"><use href="#i-{{ include.icon }}"/></svg></div>
  {% endif %}
  {% if include.title %}<h3>{{ include.title }}</h3>{% endif %}
  {% if include.text %}<p>{{ include.text }}</p>{% endif %}
  {% if include.link %}
    <p style="margin-top: var(--s-4);"><a href="{{ include.link.url }}">{{ include.link.label }} &rarr;</a></p>
  {% endif %}
</div>

{% include base_path %}
{% assign sorted = site.publications | sort: "cites" | reverse %}
{% assign shown = 0 %}
<div class="grid grid--2">
  {% for post in sorted %}
    {% if shown >= 6 %}{% break %}{% endif %}
    {% assign shown = shown | plus: 1 %}
    {% include pub-card.html post=post %}
  {% endfor %}
</div>

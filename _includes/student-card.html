<div class="student-card"{% if include.index %} data-student="{{ include.index }}" role="button" tabindex="0" aria-label="View details of {{ include.member.name }}"{% endif %}>
  <div class="student-card__avatar">
    {% if include.member.photo %}
      <img src="{{ include.member.photo }}" alt="{{ include.member.name }}">
    {% else %}
      {{ include.member.name | slice: 0, 1 }}
    {% endif %}
  </div>
  <h3>{{ include.member.name }}</h3>
  <div class="student-card__meta">
    {{ include.member.cohort }}{% if include.member.status == 'current' %} &middot; <span data-i18n="students.current">Current</span>{% endif %}
  </div>
</div>
